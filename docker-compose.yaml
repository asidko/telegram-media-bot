version: '3'

services:
  tgbot:
    build: .
    env_file:
      - .env # make sure to rename .env.example to .env and fix the values
    restart: always

  # Check Swagger UI at http://localhost:8091/swagger/index.html
  torrserver:
    image: solopasha/torrserver:v134
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - 8091:8090